[project]
name = "flycraftax"
version = "0.0.1"
description = "A fruit-fly connectome plays Craftax"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "jax[cuda12]==0.11.1",
    "numpy==2.1.2",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "craftax==1.6.1",
    "flax==0.12.9",
    "chex==0.1.92",
    "pygame==2.6.1",
    "imageio==2.37.4",
    "matplotlib==3.11.1",
    "pillow==11.0.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "brian2==2.10.1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flycraftax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the full MaleCNS data, a GPU, or a real Craftax env step"]
addopts = "-m 'not slow'"
