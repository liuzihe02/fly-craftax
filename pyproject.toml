[project]
name = "flycraftax"
version = "0.0.1"
description = "A fruit-fly connectome plays Craftax"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "jax[cuda12]==0.11.1",
    "numpy==2.1.2",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "brian2==2.10.1"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flycraftax*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the full MaleCNS data and a GPU"]
addopts = "-m 'not slow'"
